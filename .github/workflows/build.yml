name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'

          # macOS Intel (x86_64)
          - platform: macos-latest
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

          # Windows x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rust（仅安装当前平台所需的 target）
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Dependencies
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install

      # macOS SDK（仅 macOS 需要）
      - name: Setup macOS SDK
        if: matrix.platform == 'macos-latest'
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      # Build + Release
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri

          tagName: ${{ github.ref_name }}

          releaseName: 'LLM Compare Tool ${{ github.ref_name }}'

          releaseBody: |
            ## LLM Compare Tool

            Download the correct installer from Assets below.

            ### Platforms
            - macOS Apple Silicon (ARM64) → `.dmg` (aarch64)
            - macOS Intel (x86_64) → `.dmg` (x86_64)
            - Windows → `.msi` / `.exe`

          releaseDraft: false
          prerelease: false

          includeUpdaterJson: false

          args: ${{ matrix.args }}